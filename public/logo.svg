<svg width="700" height="700" viewBox="0 0 700 700" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="grad1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A1628"/>
      <stop offset="50%" stop-color="#0E7C86"/>
      <stop offset="100%" stop-color="#22D3D3"/>
    </linearGradient>
  </defs>

  <!-- Creative interlocked "A" + "H", rounded/geometric letterform style -->
  <g stroke-linejoin="round" stroke-linecap="round">

    <!-- A: left leg -->
    <path d="M 210 480 L 325 195 Q 335 175 350 195 L 385 265 L 345 265 L 325 220 L 255 480 Z" fill="url(#grad1)"/>

    <!-- A crossbar -->
    <rect x="260" y="360" width="105" height="28" rx="14" fill="url(#grad1)"/>

    <!-- shared stroke: A's right leg = H's left stroke -->
    <path d="M 350 195 Q 335 175 325 195 L 385 265 L 470 480 L 420 480 L 345 285 Z" fill="url(#grad1)"/>

    <!-- H: right stroke -->
    <rect x="460" y="195" width="32" height="285" rx="16" fill="url(#grad1)"/>

    <!-- H: crossbar -->
    <rect x="405" y="345" width="85" height="28" rx="14" fill="url(#grad1)"/>

  </g>
</svg>
